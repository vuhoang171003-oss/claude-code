<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#090A14',
            primary: '#DF6B33',
            'primary-hover': '#C25A25',
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #090A14; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e2e8f0;
      -webkit-box-shadow: 0 0 0px 1000px #1a1b2e inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .input-error {
      border-color: #f87171 !important;
      box-shadow: 0 0 0 1px #f87171;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 font-body text-slate-200">

  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 border border-primary/20 mb-4">
        <i data-lucide="layout-dashboard" class="w-7 h-7 text-primary"></i>
      </div>
      <h1 class="font-heading font-extrabold text-3xl text-white tracking-tight">Welcome Back</h1>
      <p class="text-slate-400 mt-2 text-sm">Sign in to continue to your account</p>
    </div>

    <!-- Card -->
    <form id="loginForm" class="bg-white/5 border border-white/10 rounded-2xl p-8 shadow-2xl shadow-black/50 backdrop-blur-sm" novalidate>

      <!-- Email -->
      <div class="mb-5">
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
        </div>
        <p id="emailError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Password -->
      <div class="mb-5">
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
          <button type="button" id="togglePassword" aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="eye-off" class="w-4 h-4" id="eyeIcon"></i>
          </button>
        </div>
        <p id="passwordError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Remember + Forgot -->
      <div class="flex items-center justify-between mb-8">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" class="peer hidden">
          <div class="w-5 h-5 rounded border border-white/20 bg-white/5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
            <i data-lucide="check" class="w-3 h-3 text-white hidden peer-checked:block"></i>
          </div>
          <span class="text-sm text-slate-400">Remember me</span>
        </label>
        <a href="#" class="text-sm text-primary hover:text-primary-hover transition-colors font-medium">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-heading font-extrabold text-base py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] cursor-pointer">
        Sign In
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-7">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-slate-500 uppercase tracking-wider">or continue with</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Social Login -->
      <div class="grid grid-cols-3 gap-3">

        <!-- Google -->
        <button type="button" class="flex flex-col items-center justify-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl py-3.5 transition-all duration-200 group">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="text-xs text-slate-400 group-hover:text-white transition-colors">Google</span>
        </button>

        <!-- GitHub -->
        <button type="button" class="flex flex-col items-center justify-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl py-3.5 transition-all duration-200 group">
          <svg class="w-5 h-5 text-slate-300 group-hover:text-white transition-colors" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
          <span class="text-xs text-slate-400 group-hover:text-white transition-colors">GitHub</span>
        </button>

        <!-- Facebook -->
        <button type="button" class="flex flex-col items-center justify-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl py-3.5 transition-all duration-200 group">
          <svg class="w-5 h-5 text-slate-300 group-hover:text-[#1877F2] transition-colors" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span class="text-xs text-slate-400 group-hover:text-white transition-colors">Facebook</span>
        </button>

      </div>

    </form>

    <!-- Footer -->
    <p class="text-center text-sm text-slate-500 mt-8">
      Do not have an account?
      <a href="register.html" class="text-primary hover:text-primary-hover transition-colors font-medium">Create one</a>
    </p>

  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPassword ? 'eye' : 'eye-off');
      lucide.createIcons();
    });

    // Validation helpers
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
    }

    function showError(el, errorEl, message) {
      el.classList.add('input-error');
      errorEl.querySelector('span').textContent = message;
      errorEl.classList.remove('hidden');
      lucide.createIcons();
    }

    function clearError(el, errorEl) {
      el.classList.remove('input-error');
      errorEl.classList.add('hidden');
    }

    emailInput.addEventListener('input', () => clearError(emailInput, emailError));
    passwordInput.addEventListener('input', () => clearError(passwordInput, passwordError));

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      const emailVal = emailInput.value.trim();
      if (!emailVal) {
        showError(emailInput, emailError, 'Email bắt buộc');
        valid = false;
      } else if (!isValidEmail(emailVal)) {
        showError(emailInput, emailError, 'Email không hợp lệ');
        valid = false;
      } else {
        clearError(emailInput, emailError);
      }

      if (!passwordInput.value) {
        showError(passwordInput, passwordError, 'Mật khẩu bắt buộc');
        valid = false;
      } else {
        clearError(passwordInput, passwordError);
      }

      if (valid) {
        // Proceed with form submission
      }
    });
  </script>

</body>
</html>
