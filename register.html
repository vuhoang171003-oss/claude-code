<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#090A14',
            primary: '#DF6B33',
            'primary-hover': '#C25A25',
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #090A14; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e2e8f0;
      -webkit-box-shadow: 0 0 0px 1000px #1a1b2e inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .input-error {
      border-color: #f87171 !important;
      box-shadow: 0 0 0 1px #f87171;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 font-body text-slate-200 py-10">

  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 border border-primary/20 mb-4">
        <i data-lucide="layout-dashboard" class="w-7 h-7 text-primary"></i>
      </div>
      <h1 class="font-heading font-extrabold text-3xl text-white tracking-tight">Create Account</h1>
      <p class="text-slate-400 mt-2 text-sm">Join us and get started today</p>
    </div>

    <!-- Card -->
    <form id="registerForm" class="bg-white/5 border border-white/10 rounded-2xl p-8 shadow-2xl shadow-black/50 backdrop-blur-sm" novalidate>

      <!-- Full Name -->
      <div class="mb-5">
        <label for="fullName" class="block text-sm font-medium text-slate-300 mb-2">Full Name <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="user" class="w-4 h-4"></i>
          </span>
          <input
            id="fullName"
            type="text"
            placeholder="Nguyen Van A"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
        </div>
        <p id="fullNameError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Email -->
      <div class="mb-5">
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
        </div>
        <p id="emailError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Phone Number -->
      <div class="mb-5">
        <label for="phone" class="block text-sm font-medium text-slate-300 mb-2">Phone Number <span class="text-slate-500">(optional)</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="phone" class="w-4 h-4"></i>
          </span>
          <input
            id="phone"
            type="tel"
            placeholder="0123456789"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
        </div>
        <p id="phoneError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Gender -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-300 mb-2">Gender <span class="text-slate-500">(optional)</span></label>
        <div class="flex gap-6">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="radio" name="gender" value="male" class="hidden peer">
            <div class="w-5 h-5 rounded-full border border-white/20 bg-white/5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
              <div class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></div>
            </div>
            <span class="text-sm text-slate-400">Male</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="radio" name="gender" value="female" class="hidden peer">
            <div class="w-5 h-5 rounded-full border border-white/20 bg-white/5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
              <div class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></div>
            </div>
            <span class="text-sm text-slate-400">Female</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="radio" name="gender" value="other" class="hidden peer">
            <div class="w-5 h-5 rounded-full border border-white/20 bg-white/5 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
              <div class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></div>
            </div>
            <span class="text-sm text-slate-400">Other</span>
          </label>
        </div>
      </div>

      <!-- Address -->
      <div class="mb-5">
        <label for="address" class="block text-sm font-medium text-slate-300 mb-2">Address <span class="text-slate-500">(optional)</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
          </span>
          <input
            id="address"
            type="text"
            placeholder="123 Main Street, City"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
        </div>
      </div>

      <!-- Password -->
      <div class="mb-5">
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input
            id="password"
            type="password"
            placeholder="Create a strong password"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
          <button type="button" id="togglePassword" aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="eye-off" class="w-4 h-4" id="eyeIcon"></i>
          </button>
        </div>
        <p id="passwordError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Confirm Password -->
      <div class="mb-5">
        <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-2">Confirm Password <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Re-enter your password"
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          >
          <button type="button" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
            <i data-lucide="eye-off" class="w-4 h-4" id="confirmEyeIcon"></i>
          </button>
        </div>
        <p id="confirmPasswordError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Terms -->
      <div class="mb-8">
        <label class="flex items-start gap-3 cursor-pointer select-none">
          <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded border border-white/20 bg-white/5 text-primary focus:ring-primary cursor-pointer">
          <span class="text-sm text-slate-400 leading-snug">I agree to the <a href="#" class="text-primary hover:text-primary-hover transition-colors font-medium">Terms of Service</a> and <a href="#" class="text-primary hover:text-primary-hover transition-colors font-medium">Privacy Policy</a></span>
        </label>
        <p id="termsError" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          <span></span>
        </p>
      </div>

      <!-- Create Account Button -->
      <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-heading font-extrabold text-base py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] cursor-pointer">
        Create Account
      </button>

      <!-- Back to Sign In -->
      <div class="mt-8 text-center">
        <a href="login.html" class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Back to Sign In
        </a>
      </div>

    </form>

  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility
    function setupToggle(toggleBtn, input, eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        eyeIcon.setAttribute('data-lucide', isPassword ? 'eye' : 'eye-off');
        lucide.createIcons();
      });
    }

    setupToggle(
      document.getElementById('togglePassword'),
      document.getElementById('password'),
      document.getElementById('eyeIcon')
    );

    setupToggle(
      document.getElementById('toggleConfirmPassword'),
      document.getElementById('confirmPassword'),
      document.getElementById('confirmEyeIcon')
    );

    // Validation helpers
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const termsInput = document.getElementById('terms');

    const fullNameError = document.getElementById('fullNameError');
    const emailError = document.getElementById('emailError');
    const phoneError = document.getElementById('phoneError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const termsError = document.getElementById('termsError');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
    }

    function isValidPhone(value) {
      if (!value) return true;
      return /^\d{10}$/.test(value.replace(/\s/g, ''));
    }

    function showError(el, errorEl, message) {
      el.classList.add('input-error');
      errorEl.querySelector('span').textContent = message;
      errorEl.classList.remove('hidden');
      lucide.createIcons();
    }

    function clearError(el, errorEl) {
      el.classList.remove('input-error');
      errorEl.classList.add('hidden');
    }

    // Clear errors on input
    fullNameInput.addEventListener('input', () => clearError(fullNameInput, fullNameError));
    emailInput.addEventListener('input', () => clearError(emailInput, emailError));
    phoneInput.addEventListener('input', () => clearError(phoneInput, phoneError));
    passwordInput.addEventListener('input', () => {
      clearError(passwordInput, passwordError);
      if (confirmPasswordInput.value) clearError(confirmPasswordInput, confirmPasswordError);
    });
    confirmPasswordInput.addEventListener('input', () => clearError(confirmPasswordInput, confirmPasswordError));
    termsInput.addEventListener('change', () => termsError.classList.add('hidden'));

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      // Full Name
      if (!fullNameInput.value.trim()) {
        showError(fullNameInput, fullNameError, 'Full name is required');
        valid = false;
      } else {
        clearError(fullNameInput, fullNameError);
      }

      // Email
      const emailVal = emailInput.value.trim();
      if (!emailVal) {
        showError(emailInput, emailError, 'Email is required');
        valid = false;
      } else if (!isValidEmail(emailVal)) {
        showError(emailInput, emailError, 'Email is invalid');
        valid = false;
      } else {
        clearError(emailInput, emailError);
      }

      // Phone
      if (phoneInput.value && !isValidPhone(phoneInput.value)) {
        showError(phoneInput, phoneError, 'Phone number must be 10 digits');
        valid = false;
      } else {
        clearError(phoneInput, phoneError);
      }

      // Password
      if (!passwordInput.value) {
        showError(passwordInput, passwordError, 'Password is required');
        valid = false;
      } else if (passwordInput.value.length < 6) {
        showError(passwordInput, passwordError, 'Password must be at least 6 characters');
        valid = false;
      } else {
        clearError(passwordInput, passwordError);
      }

      // Confirm Password
      if (!confirmPasswordInput.value) {
        showError(confirmPasswordInput, confirmPasswordError, 'Confirm password is required');
        valid = false;
      } else if (confirmPasswordInput.value !== passwordInput.value) {
        showError(confirmPasswordInput, confirmPasswordError, 'Passwords do not match');
        valid = false;
      } else {
        clearError(confirmPasswordInput, confirmPasswordError);
      }

      // Terms
      if (!termsInput.checked) {
        termsError.querySelector('span').textContent = 'You must agree to the terms to continue';
        termsError.classList.remove('hidden');
        lucide.createIcons();
        valid = false;
      }

      if (valid) {
        // Proceed with form submission
      }
    });
  </script>

</body>
</html>
